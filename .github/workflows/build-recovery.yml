name: Build DP18 recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-recovery.yml'
      - 'tools/build_v13.py'
      - 'tools/build_v16.py'
      - 'tools/build_v17.py'
      - 'tools/build_v18.py'
      - 'tools/build_v19.py'
      - 'tools/build_v110.py'
      - 'tools/build_v111.py'
      - 'tools/build_v111_fix.py'
      - 'tools/build_v112.py'
      - 'tools/build_v113.py'

permissions:
  contents: write

concurrency:
  group: dp18-repo-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build validated v1.13 recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          PIN='81e5e45e7fa1941e60e04403816b39283ec74b6b'
          OLD_RAW="https://raw.githubusercontent.com/MicrohardAssistenza/mh499-cctalk/${PIN}/dp18-recovery"
          WORK="$GITHUB_WORKSPACE"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP" "$WORK/.build-state"' EXIT

          curl -fsSL "$OLD_RAW/install-v1.1.sh" -o "$TMP/install-v1.1.sh"
          curl -fsSL "$OLD_RAW/hotfix-v1.2.sh" -o "$TMP/hotfix-v1.2.sh"

          sed -i \
            -e "s#^BASE_URL=.*#BASE_URL='${OLD_RAW}/DP18-FULL-RECOVERY-GITHUB.sh'#" \
            -e "s#^OUT=.*#OUT='${WORK}/DP18-FULL-RECOVERY.sh'#" \
            -e '/^exec env DP18_SFTP_PASSWORD=.*--bootstrap$/d' \
            "$TMP/install-v1.1.sh"
          chmod +x "$TMP/install-v1.1.sh"
          DP18_SFTP_PASSWORD='build-only-not-a-real-secret' "$TMP/install-v1.1.sh"

          sed -i \
            -e "s#^TARGET=.*#TARGET='${WORK}/DP18-FULL-RECOVERY.sh'#" \
            -e "s#^STATE=.*#STATE='${WORK}/.build-state'#" \
            -e '/exec "\$TARGET" --bootstrap$/d' \
            "$TMP/hotfix-v1.2.sh"
          chmod +x "$TMP/hotfix-v1.2.sh"
          DP18_SFTP_PASSWORD='build-only-not-a-real-secret' "$TMP/hotfix-v1.2.sh"

          python3 "$WORK/tools/build_v13.py" "$WORK/DP18-FULL-RECOVERY.sh"
          python3 "$WORK/tools/build_v16.py" "$WORK/DP18-FULL-RECOVERY.sh"
          python3 "$WORK/tools/build_v17.py" "$WORK/DP18-FULL-RECOVERY.sh"
          python3 "$WORK/tools/build_v18.py" "$WORK/DP18-FULL-RECOVERY.sh"
          python3 "$WORK/tools/build_v19.py" "$WORK/DP18-FULL-RECOVERY.sh"
          python3 "$WORK/tools/build_v110.py" "$WORK/DP18-FULL-RECOVERY.sh"
          python3 "$WORK/tools/build_v111.py" "$WORK/DP18-FULL-RECOVERY.sh"
          python3 "$WORK/tools/build_v111_fix.py" "$WORK/DP18-FULL-RECOVERY.sh"
          python3 "$WORK/tools/build_v112.py" "$WORK/DP18-FULL-RECOVERY.sh"
          python3 "$WORK/tools/build_v113.py" "$WORK/DP18-FULL-RECOVERY.sh"

          grep -q 'SCRIPT_VERSION="1.13.0-github"' "$WORK/DP18-FULL-RECOVERY.sh"
          grep -q '^ensure_final_312() {' "$WORK/DP18-FULL-RECOVERY.sh"
          grep -q '^request_config_backup() {' "$WORK/DP18-FULL-RECOVERY.sh"
          grep -q '^apply_configuration() {' "$WORK/DP18-FULL-RECOVERY.sh"
          grep -q 'Installo DP18Config completo in /mhdata e segnalo SOLO config-ready (TOUCH)' "$WORK/DP18-FULL-RECOVERY.sh"
          grep -q 'TOUCH_CONFIG_READY_APPLIED=1' "$WORK/DP18-FULL-RECOVERY.sh"
          grep -q 'CONFIGURAZIONE RIPRISTINATA VIA CONFIG-READY TOUCH' "$WORK/DP18-FULL-RECOVERY.sh"
          grep -q 'GITHUB_REGISTRY_LAST=' "$WORK/DP18-FULL-RECOVERY.sh"
          grep -q 'non duplico il workflow' "$WORK/DP18-FULL-RECOVERY.sh"

          python3 - "$WORK/DP18-FULL-RECOVERY.sh" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          def fn(name):
              a=s.index(name+'() {')
              b=s.index('\n}\n\n',a)
              return s[a:b]
          for name in ['discover_history','extract_payloads','ensure_dp18_software','recover_serial','ensure_final_312','request_config_backup','finish_success','resume_main','bootstrap','record_census']:
              fn(name)
          boot=fn('bootstrap')
          if 'discover_history' in boot or 'extract_payloads' in boot:
              raise SystemExit('bootstrap still performs long recovery work')
          if 'systemctl restart "$SERVICE"' not in boot:
              raise SystemExit('bootstrap does not start persistent service')
          req=fn('request_config_backup')
          if 'rm -f "$config"' in req:
              raise SystemExit('must not delete DP18Config.txt during backup')
          a=s.index('apply_configuration() {')
          b=s.index('wait_hostname_target() {',a)
          apply=s[a:b]
          for marker in ['touch "$config_ready"','wait_marker_gone "$config_ready"','request_config_backup "$verifycfg"','TOUCH_CONFIG_READY_APPLIED=1']:
              if marker not in apply:
                  raise SystemExit('v1.13 apply missing '+marker)
          if 'products-needed' in apply or 'products_needed' in apply:
              raise SystemExit('v1.13 TOUCH apply must not use products-needed')
          census=fn('record_census')
          for marker in ['GITHUB_REGISTRY_LAST','registry_key','non duplico il workflow']:
              if marker not in census:
                  raise SystemExit('registry dedup missing '+marker)
          tail=s[s.index('say "DP18 FULL RECOVERY v$SCRIPT_VERSION - resume"'):]
          for call in ['ensure_final_312','apply_configuration','finish_success']:
              if call not in tail:
                  raise SystemExit('resume path missing final stage: '+call)
          PY

          bash -n "$WORK/DP18-FULL-RECOVERY.sh"
          chmod +x "$WORK/DP18-FULL-RECOVERY.sh"
          "$WORK/DP18-FULL-RECOVERY.sh" --selftest
          sha256sum "$WORK/DP18-FULL-RECOVERY.sh" | sed 's#  .*/#  #' > "$WORK/manifest.sha256"

      - name: Commit generated recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'DP18 Recovery Builder'
          git config user.email '136606567+MicrohardAssistenza@users.noreply.github.com'
          git add DP18-FULL-RECOVERY.sh manifest.sha256
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Build validated DP18 recovery v1.13.0'

          for TRY in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent repository update, rebase/retry ${TRY}/5"
            git fetch origin main
            git rebase origin/main
            sleep $((TRY * 2))
          done

          echo 'Unable to push generated recovery after retries' >&2
          exit 1
