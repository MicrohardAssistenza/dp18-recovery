name: Update machine registry

on:
  workflow_dispatch:
    inputs:
      model:
        description: Historical machine model
        required: true
        type: string
      serial:
        description: Historical five-digit serial
        required: true
        type: string
      status:
        description: Recovery registry status
        required: true
        type: string
      source:
        description: Detection source
        required: false
        default: recovery
        type: string

permissions:
  contents: write

concurrency:
  group: dp18-repo-writes
  cancel-in-progress: false

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate registry event
        env:
          MODEL: ${{ inputs.model }}
          SERIAL: ${{ inputs.serial }}
          STATUS: ${{ inputs.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$MODEL" =~ ^[A-Z]{2}[0-9]{2}$ ]] || { echo "Invalid model: $MODEL" >&2; exit 1; }
          [[ "$SERIAL" =~ ^[0-9]{5}$ ]] || { echo "Invalid serial: $SERIAL" >&2; exit 1; }
          [ "$SERIAL" != "00000" ] || { echo "Serial 00000 is not registrable" >&2; exit 1; }
          case "$STATUS" in
            RECOVERY_DP18|RECOVERED|SKIPPED_NON_DP18) ;;
            *) echo "Invalid status: $STATUS" >&2; exit 1 ;;
          esac

      - name: Update registry and push
        env:
          MODEL: ${{ inputs.model }}
          SERIAL: ${{ inputs.serial }}
          STATUS: ${{ inputs.status }}
          SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'DP18 Registry Bot'
          git config user.email '136606567+MicrohardAssistenza@users.noreply.github.com'

          for TRY in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python3 - <<'PY'
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path('registry/machines.tsv')
          header = 'detected_at\tmodel\tserial\tstatus\tsource'
          model = os.environ['MODEL'].strip().upper()
          serial = os.environ['SERIAL'].strip()
          status = os.environ['STATUS'].strip()
          source = os.environ.get('SOURCE', 'recovery').replace('\t', ' ').replace('\r', ' ').replace('\n', ' ').strip() or 'recovery'
          now = datetime.now(timezone.utc).astimezone().isoformat(timespec='seconds')

          lines = path.read_text().splitlines() if path.exists() else []
          rows = []
          found = False
          for line in lines:
              if not line.strip() or line.startswith('detected_at\tmodel\tserial\tstatus\tsource'):
                  continue
              parts = line.split('\t', 4)
              if len(parts) != 5:
                  continue
              if parts[1] == model and parts[2] == serial:
                  old_status = parts[3]
                  if old_status == 'RECOVERED' and status != 'RECOVERED':
                      rows.append(parts)
                  elif old_status == 'SKIPPED_NON_DP18' and status != 'RECOVERED':
                      rows.append(parts)
                  else:
                      rows.append([now, model, serial, status, source])
                  found = True
              else:
                  rows.append(parts)

          if not found:
              rows.append([now, model, serial, status, source])

          rows.sort(key=lambda r: (r[1], r[2]))
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(header + '\n' + '\n'.join('\t'.join(r) for r in rows) + '\n')
          PY

            if git diff --quiet -- registry/machines.tsv; then
              echo "Registry already up to date: ${MODEL}-${SERIAL} ${STATUS}"
              exit 0
            fi

            git add registry/machines.tsv
            git commit -m "Registry ${MODEL}-${SERIAL} ${STATUS}"
            if git push origin HEAD:main; then
              echo "Registry updated: ${MODEL}-${SERIAL} ${STATUS}"
              exit 0
            fi

            echo "Concurrent push detected, retry ${TRY}/5"
            sleep $((TRY * 2))
          done

          echo "Unable to update registry after retries" >&2
          exit 1
